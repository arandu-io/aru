name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The CLI has no dependencies of its own. bubbletea arrives in phase 2, with
      # the generator that needs it, and this check is what makes that deliberate.
      - name: dependency budget
        run: |
          deps=$(go list -m all | tail -n +2 || true)
          if [ -n "$deps" ]; then
            echo "the CLI is meant to have no dependencies yet:"
            echo "$deps"
            exit 1
          fi

      - name: build
        run: go build -o /tmp/aru .

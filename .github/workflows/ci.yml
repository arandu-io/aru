name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.25"), and setup-go installs exactly that -- 1.25.0, whose
          # standard library carries vulnerabilities fixed in 1.25.11 and later.
          # govulncheck below is right to fail on it.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      - name: gofmt
        # `gofmt -l .` skips nothing, and two things here are not valid Go on
        # purpose:
        #
        #   testdata/    fixtures the doctor has to reject, including a file
        #                that does not parse -- which is the test
        #   *.kyse.go    kyse sources; the compiler excludes them by build tag,
        #                and gofmt does not read build tags
        #
        # `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The CLI may have dependencies; the core may not. That separation is why
      # ADR 0006 put the CLI in its own module, and ADR 0017 sets the rule:
      # each one enters with an ADR, not with a go get.
      #
      # Checking against the list rather than against zero keeps the same
      # friction where it still makes sense.
      - name: dependency budget
        run: |
          allowed="gopkg.in/yaml.v3"
          extra=""
          # What the binary carries, not what go.sum mentions: `go list -m all`
          # includes the dependency's test dependency, which is never compiled.
          linked=$(go list -deps -f '{{if .Module}}{{if not .Standard}}{{.Module.Path}}{{end}}{{end}}' ./... | sort -u | grep -v '^github.com/arandu-io/aru$')
          for dep in $linked; do
            case " $allowed " in *" $dep "*) ;; *) extra="$extra $dep" ;; esac
          done
          if [ -n "$extra" ]; then
            echo "the CLI carries dependencies with no ADR:$extra"
            echo "See docs/adr/0017 -- each one enters with a decision, not a go get."
            exit 1
          fi

      - name: build
        run: go build -o /tmp/aru .

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

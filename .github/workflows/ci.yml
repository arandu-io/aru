name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Not go-version-file: go.mod declares the MINIMUM language version
          # ("go 1.26"), and setup-go installs exactly that -- the .0 release,
          # whose standard library carries whatever govulncheck below has since
          # found in it. A floor for the language is not a claim that the first
          # patch of that line is safe to build with, and govulncheck is right
          # to fail on one that is not.
          #
          # "stable" is the version people actually run, which is what CI should
          # be testing against. The minimum in go.mod stays where it is.
          go-version: stable

      - name: gofmt
        # `gofmt -l .` skips nothing, and two things here are not valid Go on
        # purpose:
        #
        #   testdata/    fixtures the doctor has to reject, including a file
        #                that does not parse -- which is the test
        #   *.kyse.go    kyse sources; the compiler excludes them by build tag,
        #                and gofmt does not read build tags
        #
        # `go build`, `go vet` and `go test` skip both on their own.
        run: |
          unformatted=$(find . -name '*.go' -not -path '*/testdata/*' \
                          -not -name '*.kyse.go' -exec gofmt -l {} +)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test -race ./...

      # The CLI may have dependencies; the core may not. That separation is why
      # ADR 0006 put the CLI in its own module, and ADR 0017 sets the rule:
      # each one enters with an ADR, not with a go get.
      #
      # Checking against the list rather than against zero keeps the same
      # friction where it still makes sense.
      - name: dependency budget
        run: |
          allowed="gopkg.in/yaml.v3"
          extra=""
          # What the binary carries, not what go.sum mentions: `go list -m all`
          # includes the dependency's test dependency, which is never compiled.
          linked=$(go list -deps -f '{{if .Module}}{{if not .Standard}}{{.Module.Path}}{{end}}{{end}}' ./... | sort -u | grep -v '^github.com/arandu-io/aru$')
          for dep in $linked; do
            case " $allowed " in *" $dep "*) ;; *) extra="$extra $dep" ;; esac
          done
          if [ -n "$extra" ]; then
            echo "the CLI carries dependencies with no ADR:$extra"
            echo "See docs/adr/0017 -- each one enters with a decision, not a go get."
            exit 1
          fi

      - name: build
        run: go build -o /tmp/aru .

      # golangci-lint reads this repository. `aru doctor` reads the application
      # this repository generates, and refuses to run on anything else -- see
      # the header of .golangci.yml for the line between them, and for why three
      # linters are on rather than thirty.
      #
      # Pinned to an exact version while govulncheck below is not, because the
      # two go red for different reasons. A linter release adds checks, so an
      # unpinned one turns CI red on a commit that changed nothing, and a CI
      # that fails for reasons nobody caused is one people learn to re-run
      # rather than read. govulncheck going red on a newly published
      # vulnerability is the point of it, and it reads its database at run time,
      # so pinning the binary would not hold the answer still anyway.
      #
      # go install rather than the golangci-lint action: setup-go above has
      # already provided the toolchain, and this keeps what CI trusts to the
      # module proxy instead of adding a third-party action to it.
      - name: lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.2
          golangci-lint run ./...

      # Required by doc 24: a known vulnerability blocks the merge rather than
      # showing up in a report nobody reads.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
